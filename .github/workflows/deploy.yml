      #     printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/gcp_key.json"
      #     export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp_key.json"
